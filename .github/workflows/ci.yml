name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Includes the loopback end-to-end flow on fixtures/consumer (start/stop scripts, runner, base check).
      - name: node --test
        run: node --test "scripts/*.test.mjs"

  # Single aggregator status check. Require only `ci` (on a repository whose plan supports it), which
  # keeps the rule stable if the matrix above changes. `if: always()` runs it regardless of upstream
  # outcomes; anything other than success/skipped fails it.
  ci:
    name: ci
    needs: [unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs passed or were skipped
        env:
          UNIT_TESTS: ${{ needs.unit-tests.result }}
        run: |
          set -euo pipefail
          fail=0
          for entry in "unit-tests=$UNIT_TESTS"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) echo "ok: $name=$result" ;;
              *) echo "::error::$name=$result"; fail=1 ;;
            esac
          done
          exit "$fail"
