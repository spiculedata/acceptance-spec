name: selftest

# Calls this repository's OWN reusable workflows against fixtures/consumer, so a change here is
# proven end to end on a loopback fixture server (no external network). Callers in other
# repositories reference these workflows as
#   spiculedata/acceptance-spec/.github/workflows/<name>.yml@<full-sha>
# whereas this file uses the local ./ form; that cross-repository `uses:` is the part that cannot be
# exercised from here before the workflows exist at a SHA on main (see README, "Verification").

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  convention:
    name: selftest / convention
    uses: ./.github/workflows/convention.yml
    with:
      # A cutoff far above any real issue: the gate runs for real and reports "not enforced".
      enforce-from-issue: "999999"
      mode: enforce

  # The fixture has a build step (a copy into dist/) so the share-build path is exercised: run-specs
  # uploads dist/, base-check (ordered after it) takes it instead of rebuilding head.
  run-specs:
    name: selftest / run-specs
    uses: ./.github/workflows/run-specs.yml
    with:
      working-directory: fixtures/consumer
      build-command: mkdir -p dist && cp server.mjs dist/server.mjs
      start-command: PORT=18080 node dist/server.mjs
      base-url: http://127.0.0.1:18080
      ready-url: http://127.0.0.1:18080/api/healthz
      ready-timeout: 30
      base-path: /api
      timeout-minutes: 10
      share-build: true
      share-build-paths: dist

  base-check:
    name: selftest / base-check
    needs: [run-specs]
    uses: ./.github/workflows/base-check.yml
    with:
      working-directory: fixtures/consumer
      build-command: mkdir -p dist && cp server.mjs dist/server.mjs
      start-command: PORT=18080 node dist/server.mjs
      base-url: http://127.0.0.1:18080
      ready-url: http://127.0.0.1:18080/api/healthz
      ready-timeout: 30
      base-path: /api
      timeout-minutes: 10
      share-build: true

  # A spec that is red on head. mode: report keeps every job green, which is exactly the situation the
  # verdict output is for: `assert-verdicts` below checks the output says fail while the job is green.
  red-run-specs:
    name: selftest / red run-specs
    uses: ./.github/workflows/run-specs.yml
    with:
      working-directory: fixtures/red-on-head
      mode: report
      artifact-name: acceptance-results-red

  red-base-check:
    name: selftest / red base-check
    uses: ./.github/workflows/base-check.yml
    with:
      working-directory: fixtures/red-on-head
      mode: report
      artifact-name: acceptance-base-check-red

  green-base-check:
    name: selftest / green-on-base base-check
    uses: ./.github/workflows/base-check.yml
    with:
      working-directory: fixtures/green-on-base
      mode: report
      artifact-name: acceptance-base-check-green

  # The thin-caller gate against fixtures/thin-caller. `good` is wired as a caller should be and must pass.
  # `drifted` is wired wrongly on purpose (a branch pin, two different SHAs, a local copy of a shared
  # script). In mode report it keeps the job green and the verdict says fail, which assert-verdicts checks.
  thin-caller-good:
    name: selftest / thin-caller good
    uses: ./.github/workflows/thin-caller-gate.yml
    with:
      working-directory: fixtures/thin-caller/good
      only-when-relevant: false
      mode: enforce

  thin-caller-drifted:
    name: selftest / thin-caller drifted
    uses: ./.github/workflows/thin-caller-gate.yml
    with:
      working-directory: fixtures/thin-caller/drifted
      only-when-relevant: false
      mode: report

  # The same drifted fixture in mode enforce must FAIL the gate. A failing reusable-workflow call cannot be
  # inverted inside a workflow, so the script the workflow runs is invoked directly and its exit code asserted.
  thin-caller-drift-must-fail:
    name: selftest / thin-caller drift fails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enforce mode exits 1 on the drifted fixture
        run: |
          rc=0
          node scripts/thin-caller-gate.mjs --root fixtures/thin-caller/drifted --mode enforce > "$RUNNER_TEMP/drift.log" || rc=$?
          cat "$RUNNER_TEMP/drift.log"
          if [ "$rc" -ne 1 ]; then echo "::error::expected exit 1 on the drifted fixture, got $rc"; exit 1; fi
          for rule in pin-sha single-pin local-copy visible-input; do
            grep -q "\[$rule\]" "$RUNNER_TEMP/drift.log" || { echo "::error::no $rule finding on the drifted fixture"; exit 1; }
          done

  # Pin health against fixtures/pin-health (it pins a real, old commit of this repository). Report only:
  # open-issue stays false, so nothing is written. The calling job holds issues: write only because a
  # called workflow cannot be granted a scope its caller lacks, and pin-health.yml declares it on its
  # opt-in job.
  pin-health:
    name: selftest / pin-health
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/pin-health.yml
    with:
      working-directory: fixtures/pin-health
      open-issue: false

  # The sticky comment, for real, on this repository's own same-repository PRs (a fork PR's token is
  # read-only, so the job is skipped there). Only this job holds pull-requests: write.
  comment:
    name: selftest / comment
    needs: [convention, run-specs, base-check]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/comment.yml
    with:
      comment: true
      heading: Acceptance self-test (fixture)
      convention-verdict: ${{ needs.convention.outputs.verdict }}
      run-specs-verdict: ${{ needs.run-specs.outputs.verdict }}
      base-check-verdict: ${{ needs.base-check.outputs.verdict }}
      report-only: "false"

  # Aggregate for this file, so one name says whether the self-tests are green.
  selftest:
    name: selftest
    needs: [convention, run-specs, base-check, red-run-specs, red-base-check, green-base-check, comment, thin-caller-good, thin-caller-drifted, thin-caller-drift-must-fail, pin-health]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs passed or were skipped
        env:
          CONVENTION: ${{ needs.convention.result }}
          RUN_SPECS: ${{ needs.run-specs.result }}
          BASE_CHECK: ${{ needs.base-check.result }}
          RED_RUN_SPECS: ${{ needs.red-run-specs.result }}
          RED_BASE_CHECK: ${{ needs.red-base-check.result }}
          GREEN_BASE_CHECK: ${{ needs.green-base-check.result }}
          COMMENT: ${{ needs.comment.result }}
          THIN_GOOD: ${{ needs.thin-caller-good.result }}
          THIN_DRIFTED: ${{ needs.thin-caller-drifted.result }}
          THIN_MUST_FAIL: ${{ needs.thin-caller-drift-must-fail.result }}
          PIN_HEALTH: ${{ needs.pin-health.result }}
        run: |
          set -euo pipefail
          fail=0
          for entry in "convention=$CONVENTION" "run-specs=$RUN_SPECS" "base-check=$BASE_CHECK" "red-run-specs=$RED_RUN_SPECS" "red-base-check=$RED_BASE_CHECK" "green-base-check=$GREEN_BASE_CHECK" "comment=$COMMENT" "thin-caller-good=$THIN_GOOD" "thin-caller-drifted=$THIN_DRIFTED" "thin-caller-drift-must-fail=$THIN_MUST_FAIL" "pin-health=$PIN_HEALTH"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success|skipped) echo "ok: $name=$result" ;;
              *) echo "::error::$name=$result"; fail=1 ;;
            esac
          done
          exit "$fail"

  # The verdicts the callers see. A red spec in report mode leaves its job green, so this is the proof
  # that the verdict output, not the job result, carries it. base-check only does real work on a PR that
  # adds or changes a spec in its fixture, so on any other PR `skipped` is the expected verdict there.
  assert-verdicts:
    name: selftest / verdicts
    needs: [convention, run-specs, base-check, red-run-specs, red-base-check, green-base-check, thin-caller-good, thin-caller-drifted, pin-health]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Each verdict is what the fixture should produce
        env:
          RUN_SPECS: ${{ needs.run-specs.outputs.verdict }}
          RED_RUN_SPECS: ${{ needs.red-run-specs.outputs.verdict }}
          RED_RUN_SPECS_RESULT: ${{ needs.red-run-specs.result }}
          RED_RUN_SPECS_REPORT_ONLY: ${{ needs.red-run-specs.outputs.report-only }}
          BASE_CHECK: ${{ needs.base-check.outputs.verdict }}
          BUILD_REUSED: ${{ needs.base-check.outputs.build-reused }}
          RED_BASE_CHECK: ${{ needs.red-base-check.outputs.verdict }}
          GREEN_BASE_CHECK: ${{ needs.green-base-check.outputs.verdict }}
          THIN_GOOD: ${{ needs.thin-caller-good.outputs.verdict }}
          THIN_DRIFTED: ${{ needs.thin-caller-drifted.outputs.verdict }}
          THIN_DRIFTED_RESULT: ${{ needs.thin-caller-drifted.result }}
          THIN_DRIFTED_FINDINGS: ${{ needs.thin-caller-drifted.outputs.findings }}
          PIN_BEHIND: ${{ needs.pin-health.outputs.behind }}
        run: |
          fail=0
          expect() { # name actual allowed...
            local name="$1" actual="$2"; shift 2
            for ok in "$@"; do if [ "$actual" = "$ok" ]; then echo "ok: $name=$actual"; return; fi; done
            echo "::error::$name=$actual, expected one of: $*"; fail=1
          }
          expect run-specs "$RUN_SPECS" pass
          expect red-run-specs "$RED_RUN_SPECS" fail
          expect "red-run-specs job result (report mode keeps it green)" "$RED_RUN_SPECS_RESULT" success
          expect red-run-specs-report-only "$RED_RUN_SPECS_REPORT_ONLY" true
          expect base-check "$BASE_CHECK" red-on-base-green-on-head skipped
          expect red-base-check "$RED_BASE_CHECK" fail skipped
          expect green-base-check "$GREEN_BASE_CHECK" passes-on-base skipped
          # When base-check did real work, head must have been taken from run-specs, not rebuilt.
          if [ "$BASE_CHECK" != "skipped" ]; then expect build-reused "$BUILD_REUSED" true; fi
          expect thin-caller-good "$THIN_GOOD" pass
          expect thin-caller-drifted "$THIN_DRIFTED" fail
          expect "thin-caller-drifted job result (report mode keeps it green)" "$THIN_DRIFTED_RESULT" success
          expect thin-caller-drifted-findings "$THIN_DRIFTED_FINDINGS" 6
          if ! [[ "$PIN_BEHIND" =~ ^[0-9]+$ ]]; then echo "::error::pin-health behind='$PIN_BEHIND', expected a number"; fail=1; else echo "ok: pin-health behind=$PIN_BEHIND"; fi
          exit "$fail"
